name: Build inject_jni.dylib

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Linux — syntax check only (fast; can't produce a .dylib)
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Syntax check
        run: |
          JAVA_HOME="$JAVA_HOME" make test-syntax
          echo "Syntax check passed."

  # macOS — full .dylib build + ad-hoc sign
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build dylib
        run: |
          JAVA_HOME="$JAVA_HOME" make

      - name: Verify binary
        run: |
          file inject_jni.dylib
          ls -lh inject_jni.dylib
          lipo -info inject_jni.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inject_jni.dylib
          path: inject_jni.dylib
          retention-days: 30
