name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Linux — syntax check only
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Syntax check
        run: |
          JAVA_HOME="$JAVA_HOME" make test-syntax
          echo "Syntax check passed."

  # macOS — full .dylib build + sign
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build dylib
        run: |
          JAVA_HOME="$JAVA_HOME" make
      - name: Verify binary
        run: |
          file cheat_phase2.dylib
          ls -lh cheat_phase2.dylib
          lipo -info cheat_phase2.dylib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cheat_phase2.dylib
          path: cheat_phase2.dylib
          retention-days: 30
